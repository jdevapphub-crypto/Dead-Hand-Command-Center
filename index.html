<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD HAND - Command Center</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #fff; }

  #login {
    position: fixed; inset: 0; z-index: 9999;
    background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #login .box {
    background: #151515; border: 1px solid #333;
    border-radius: 16px; padding: 24px;
    width: 100%; max-width: 380px; text-align: center;
  }
  #login h1 {
    color: #ff2222; font-size: 22px; letter-spacing: 3px;
    margin: 0 0 8px; font-weight: 900;
  }
  #login .sub { color: #666; font-size: 11px; letter-spacing: 2px; margin-bottom: 20px; }
  #login input {
    width: 100%; padding: 14px; background: #000;
    border: 1px solid #444; border-radius: 10px;
    color: #fff; font-size: 16px; letter-spacing: 3px;
    text-align: center; outline: none;
  }
  #login input:focus { border-color: #7c3aed; }
  #login button {
    width: 100%; padding: 16px; border: none;
    border-radius: 14px; font-weight: bold; font-size: 15px;
    margin-top: 12px; cursor: pointer;
    background: #7c3aed; color: #fff; letter-spacing: 1px;
  }
  #login .err { color: #ff5555; font-size: 11px; margin-top: 10px; }

  .app { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 340px; background: #0e0e0e;
    border-right: 1px solid #222;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar .top {
    padding: 14px; border-bottom: 1px solid #222;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar .top h1 {
    color: #ff2222; font-size: 14px; letter-spacing: 2px;
    margin: 0; font-weight: 900;
  }
  .sidebar .top button {
    background: transparent; border: 1px solid #444;
    color: #888; padding: 4px 10px; border-radius: 6px;
    cursor: pointer; font-size: 10px;
  }
  .sidebar .stats {
    padding: 12px 14px; border-bottom: 1px solid #222;
    font-size: 11px; color: #888;
    display: flex; justify-content: space-between;
  }
  .sidebar .stats strong { color: #fff; }

  #deviceList { flex: 1; overflow-y: auto; }

  .device-row {
    padding: 12px 14px; border-bottom: 1px solid #1a1a1a;
    cursor: pointer; transition: background 0.15s;
  }
  .device-row:hover { background: #151515; }
  .device-row.selected { background: #1a1200; border-left: 3px solid #d4a017; }
  .device-row .name { color: #fff; font-weight: bold; font-size: 13px; }
  .device-row .code { color: #22c55e; font-size: 11px; letter-spacing: 2px; margin-top: 2px; }
  .device-row .meta { color: #888; font-size: 10px; margin-top: 4px; }
  .device-row .badge {
    display: inline-block; padding: 2px 6px; border-radius: 4px;
    font-size: 9px; font-weight: bold; margin-top: 4px; letter-spacing: 1px;
  }
  .badge.online { background: #0d2a0d; color: #22c55e; }
  .badge.recent { background: #2a2200; color: #d4a017; }
  .badge.offline { background: #1a1a1a; color: #666; }

  .ring-btn {
    margin-top: 8px;
    background: #7c3aed;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .ring-btn:hover { background: #6d28d9; }
  .ring-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .map-area { flex: 1; position: relative; }
  #map { position: absolute; inset: 0; }

  .toolbar {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.85); border: 1px solid #333;
    border-radius: 10px; padding: 8px 12px;
    font-size: 11px; color: #888; z-index: 500;
    display: flex; align-items: center; gap: 8px;
  }
  .toolbar button {
    background: #222; border: 1px solid #444;
    color: #fff; padding: 6px 10px; border-radius: 6px;
    cursor: pointer; font-size: 11px;
  }

  .banner {
    position: fixed; top: 0; left: 0; right: 0;
    background: #2a0000; border-bottom: 2px solid #ff2222;
    color: #ff7777; padding: 12px 16px;
    font-size: 13px; font-weight: bold;
    z-index: 8000; display: flex; align-items: center; gap: 12px;
    transform: translateY(-100%); transition: transform 0.3s;
  }
  .banner.show { transform: translateY(0); }
  .banner button {
    margin-left: auto; background: #ff2222; color: #fff;
    border: none; padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-weight: bold; font-size: 11px;
  }

  .empty {
    padding: 30px 20px; text-align: center;
    color: #555; font-size: 12px; line-height: 1.6;
  }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>☠️ DEAD HAND</h1>
    <div class="sub">COMMAND CENTER</div>
    <input id="keyInput" type="password" placeholder="DEVELOPER KEY" autocomplete="off">
    <button id="loginBtn">UNLOCK</button>
    <div id="loginErr" class="err" style="display: none;"></div>
  </div>
</div>

<div class="app" id="app" style="display: none;">
  <div class="sidebar">
    <div class="top">
      <h1>☠️ DEAD HAND</h1>
      <button id="logoutBtn">LOCK</button>
    </div>
    <div class="stats">
      <span>REPORTED LOST</span>
      <span><strong id="countLost">0</strong> devices</span>
    </div>
    <div id="deviceList">
      <div class="empty">Loading…</div>
    </div>
  </div>
  <div class="map-area">
    <div id="map"></div>
    <div class="toolbar">
      <span id="lastUpdate">—</span>
      <button id="refreshBtn">REFRESH</button>
      <button id="fitAllBtn">FIT ALL</button>
      <button id="ringAllBtn" style="background:#7c3aed;">🔔 RING ALL</button>
    </div>
  </div>
</div>

<div id="alertBanner" class="banner">
  <span>⚠️</span>
  <span id="alertText">—</span>
  <button onclick="hideBanner()">DISMISS</button>
</div>

<script>
const DEV_KEY = "0105075874088";
const PUSH_URL = "https://deadhand-push-server.onrender.com/send-push";
const PUSH_AUTH = "dh-push-2026-secret-key";

const firebaseConfig = {
    apiKey:            "AIzaSyDNF5lQPOykjetuB4fPQ6XalQJnuWvc9PQ",
    authDomain:        "dead-man-s-switch-3344a.firebaseapp.com",
    databaseURL:       "https://dead-man-s-switch-3344a-default-rtdb.firebaseio.com",
    projectId:         "dead-man-s-switch-3344a",
    storageBucket:     "dead-man-s-switch-3344a.appspot.com",
    messagingSenderId: "643809059953",
    appId:             "1:643809059953:web:387f2b42f7acc480cc67d0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const $ = (id) => document.getElementById(id);

let map = null;
let markers = {};
let devices = {};
let selectedUid = null;
let pollTimer = null;

// ---- Login ----
function checkLogin() {
  const saved = sessionStorage.getItem("dh_admin");
  if (saved === "1") {
    $("login").style.display = "none";
    $("app").style.display = "flex";
    startApp();
  }
}

$("loginBtn").addEventListener("click", () => {
  const key = $("keyInput").value.trim();
  if (key === DEV_KEY) {
    sessionStorage.setItem("dh_admin", "1");
    $("login").style.display = "none";
    $("app").style.display = "flex";
    startApp();
  } else {
    $("loginErr").style.display = "block";
    $("loginErr").textContent = "Invalid key.";
  }
});
$("keyInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") $("loginBtn").click();
});

$("logoutBtn").addEventListener("click", () => {
  sessionStorage.removeItem("dh_admin");
  location.reload();
});

// ---- Map ----
function initMap() {
  map = L.map("map", { zoomControl: true }).setView([-30.5595, 22.9375], 5);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "© OpenStreetMap"
  }).addTo(map);
}

// ---- Polling ----
async function fetchLostDevices() {
  try {
    const snap = await db.ref("users").once("value");
    const users = snap.val() || {};
    const now = Date.now();

    const next = {};
    for (const uid of Object.keys(users)) {
      const u = users[uid];
      const profile = (u && u.profile) || null;
      if (!profile) continue;

      const lost = profile.lost;
      if (!lost || lost.reported !== true) continue;

      const loc = profile.lastLocation || {};
      const lastActive = profile.lastActive || 0;
      const online = lastActive > 0 && (now - lastActive) < 180000;
      const recent = lastActive > 0 && (now - lastActive) < 3600000;

      next[uid] = {
        uid,
        name: profile.name || "Unknown",
        code: profile.code || "—",
        lastActive,
        online,
        recent,
        lat: loc.lat || null,
        lon: loc.lon || null,
        acc: loc.acc || null,
        locTime: loc.time || 0,
        reportedAt: lost.reportedAt || 0,
      };
    }

    for (const uid of Object.keys(next)) {
      const was = devices[uid];
      const nowD = next[uid];
      if (nowD.online && (!was || !was.online)) {
        onDeviceCameOnline(nowD);
      }
    }

    devices = next;
    renderDevices();
    renderMarkers();
    $("lastUpdate").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    console.warn("fetch error:", e.message);
  }
}

function onDeviceCameOnline(dev) {
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  $("alertText").textContent = dev.name + " is ONLINE!";
  $("alertBanner").classList.add("show");
  setTimeout(hideBanner, 6000);
}

window.hideBanner = function() {
  $("alertBanner").classList.remove("show");
};

// ---- Ring ----
async function ringDevice(uid) {
  const d = devices[uid];
  if (!d) return;

  const btn = document.querySelector('.ring-btn[data-ring="' + uid + '"]');
  if (btn) { btn.disabled = true; btn.textContent = "…"; }

  try {
    const snap = await db.ref("users/" + uid + "/profile/fcmToken").get();
    const token = snap.exists() ? snap.val() : "";
    if (!token) {
      alert("Target has no FCM token — is their app installed and signed in?");
      return;
    }

    const res = await fetch(PUSH_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-auth-token": PUSH_AUTH
      },
      body: JSON.stringify({
        token: token,
        title: "RING DEVICE",
        body: "Operator is trying to locate this phone.",
        data: { type: "ring", fromName: "DEAD HAND" }
      })
    });

    if (!res.ok) {
      const err = await res.text();
      alert("Ring failed: " + err);
      return;
    }

    $("alertText").textContent = "Ringing " + d.name + "…";
    $("alertBanner").classList.add("show");
    setTimeout(hideBanner, 4000);
  } catch (e) {
    alert("Error: " + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "🔔 RING"; }
  }
}

// ---- Rendering ----
function renderDevices() {
  const list = $("deviceList");
  const keys = Object.keys(devices);
  $("countLost").textContent = keys.length;

  if (keys.length === 0) {
    list.innerHTML = '<div class="empty">No devices currently reported as lost.</div>';
    return;
  }

  keys.sort((a, b) => {
    const A = devices[a], B = devices[b];
    const scoreA = A.online ? 3 : (A.recent ? 2 : 1);
    const scoreB = B.online ? 3 : (B.recent ? 2 : 1);
    return scoreB - scoreA;
  });

  list.innerHTML = keys.map((uid) => {
    const d = devices[uid];
    const badgeClass = d.online ? "online" : (d.recent ? "recent" : "offline");
    const badgeText = d.online ? "ONLINE" : (d.recent ? "RECENT" : "OFFLINE");
    const lastSeen = d.lastActive > 0
      ? new Date(d.lastActive).toLocaleString()
      : "never";
    return '<div class="device-row ' + (uid === selectedUid ? 'selected' : '') + '" data-uid="' + uid + '">' +
      '<div class="name">' + escapeHtml(d.name) + '</div>' +
      '<div class="code">' + escapeHtml(d.code) + '</div>' +
      '<div class="meta">Last seen: ' + lastSeen + '</div>' +
      '<div class="badge ' + badgeClass + '">' + badgeText + '</div>' +
      '<button class="ring-btn" data-ring="' + uid + '">🔔 RING</button>' +
      '</div>';
  }).join("");

  document.querySelectorAll(".device-row").forEach((row) => {
    row.addEventListener("click", (e) => {
      if (e.target.classList.contains("ring-btn")) return;
      selectDevice(row.dataset.uid);
    });
  });

  document.querySelectorAll(".ring-btn").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      ringDevice(btn.dataset.ring);
    });
  });
}

function renderMarkers() {
  if (!map) return;

  const activeUids = Object.keys(devices);

  for (const uid of Object.keys(markers)) {
    if (!activeUids.includes(uid)) {
      map.removeLayer(markers[uid]);
      delete markers[uid];
    }
  }

  for (const uid of activeUids) {
    const d = devices[uid];
    if (d.lat == null || d.lon == null) continue;

    const color = d.online ? "#22c55e" : (d.recent ? "#d4a017" : "#888");
    const circle = '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:' + color + ';border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,0.6);"></span>';

    const icon = L.divIcon({
      html: circle,
      className: "",
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    if (markers[uid]) {
      markers[uid].setLatLng([d.lat, d.lon]);
      markers[uid].setIcon(icon);
      markers[uid].setPopupContent(popupHtml(d));
    } else {
      markers[uid] = L.marker([d.lat, d.lon], { icon })
        .addTo(map)
        .bindPopup(popupHtml(d));
      markers[uid].on("click", () => selectDevice(uid));
    }
  }
}

function popupHtml(d) {
  return '<div style="font-size:12px;line-height:1.5;">' +
    '<strong>' + escapeHtml(d.name) + '</strong><br>' +
    '<span style="color:#22c55e;">' + escapeHtml(d.code) + '</span><br>' +
    '<span style="color:' + (d.online ? '#22c55e' : '#888') + ';">' + (d.online ? 'ONLINE' : 'Offline') + '</span><br>' +
    (d.locTime ? 'Last: ' + new Date(d.locTime).toLocaleString() : '') +
    '</div>';
}

function selectDevice(uid) {
  selectedUid = uid;
  const d = devices[uid];
  if (!d) return;
  renderDevices();
  if (d.lat != null && d.lon != null) {
    map.setView([d.lat, d.lon], 16);
    if (markers[uid]) markers[uid].openPopup();
  } else {
    alert("No location recorded yet for " + d.name);
  }
}

function fitAll() {
  if (!map) return;
  const points = Object.values(devices)
    .filter((d) => d.lat != null && d.lon != null)
    .map((d) => [d.lat, d.lon]);
  if (points.length === 0) { alert("No locations to fit."); return; }
  if (points.length === 1) { map.setView(points[0], 16); return; }
  map.fitBounds(points, { padding: [40, 40] });
}

function escapeHtml(s) {
  return String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// ---- Start ----
async function startApp() {
  initMap();
  await fetchLostDevices();
  pollTimer = setInterval(fetchLostDevices, 30000);
}

$("refreshBtn").addEventListener("click", fetchLostDevices);
$("fitAllBtn").addEventListener("click", fitAll);
$("ringAllBtn").addEventListener("click", async () => {
  const uids = Object.keys(devices);
  if (uids.length === 0) { alert("No devices to ring."); return; }
  if (!confirm("Ring ALL " + uids.length + " devices?")) return;
  for (const uid of uids) {
    await ringDevice(uid);
  }
});

checkLogin();
</script>

</body>
</html>
